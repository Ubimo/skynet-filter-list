name: Update validated IPv4 feeds

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/**
      - scripts/**
      - tests/**
      - sources.json
      - allowlist.json
      - filter.list
      - generated/**
      - AUDIT.md
  push:
    branches: [main]
    paths:
      - .github/workflows/**
      - scripts/**
      - tests/**
      - sources.json
      - allowlist.json
      - filter.list
      - generated/**
      - AUDIT.md

permissions:
  contents: read

concurrency:
  group: ipv4-feeds-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Test submitted files without overwriting them or contacting upstreams
        run: python -m unittest discover -s tests -v
      - name: Audit exact submitted snapshot
        run: python scripts/audit_sources.py

  update:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Refresh independent sources
        id: refresh
        continue-on-error: true
        run: python scripts/update_ipv4_feeds.py
      - name: Validate exact candidate, including bounded fallbacks
        run: |
          test -f .update-result.json
          python scripts/audit_sources.py --current
      - name: Publish only the tested tree
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "main changed during validation; rerun the workflow on the new tree."
            exit 1
          fi
          git add -- generated/*.ipv4 generated/status.json filter.list AUDIT.md
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update validated IPv4 snapshots and source health"
            # No force, reset, rebase or copying old outputs onto a newer main.
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Verify published raw files at the exact commit
        env:
          PUBLISHED_SHA: ${{ steps.publish.outputs.sha }}
        run: python scripts/audit_sources.py --remote-ref "$PUBLISHED_SHA" --current
      - name: Report source failures after publishing healthy updates
        if: always()
        env:
          REFRESH_OUTCOME: ${{ steps.refresh.outcome }}
        run: |
          if [ -f AUDIT.md ]; then cat AUDIT.md >> "$GITHUB_STEP_SUMMARY"; fi
          if [ "$REFRESH_OUTCOME" != "success" ]; then
            echo "One or more feeds failed. See generated/status.json; healthy feeds were eligible for publication."
            exit 1
          fi
